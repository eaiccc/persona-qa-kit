name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
        # The kit must work with and without PyYAML: the fallback parser exists
        # precisely for machines that have no packages installed, so testing
        # only the PyYAML path would leave it unexercised.
        pyyaml: [true, false]

    name: py${{ matrix.python }} ${{ matrix.pyyaml && 'with PyYAML' || 'stdlib only' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install PyYAML
        if: matrix.pyyaml
        run: python -m pip install --quiet PyYAML

      - name: Schema self-check
        run: ./bin/pqa validate --self-check

      - name: Gate the worked example
        run: ./bin/pqa gate examples/runs/2026-08-15-notes-app

      - name: Tests
        run: cd tests && python -m unittest discover -s . -p 'test_*.py' -v

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check hook scripts
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck adapters/*/hook.sh bin/pqa
